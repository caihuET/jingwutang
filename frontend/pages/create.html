<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>创建角色 | 精武堂</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei",sans-serif;background:#f5f0e8;color:#2c1810;height:100vh;display:flex;flex-direction:column}
.topbar{height:50px;background:linear-gradient(90deg,#1a1a2e,#2c2c44);border-bottom:2px solid #c9a96e;display:flex;align-items:center;padding:0 20px;flex-shrink:0}
.topbar .logo{font-size:18px;font-weight:700;color:#c9a96e;letter-spacing:4px;margin-right:24px}
.topbar .logo span{color:#c9a96e}
.topbar .player{margin-left:auto;color:#c9a96e;font-size:13px}
.game-body{display:flex;flex:1;overflow:hidden}
.sidebar{width:200px;background:linear-gradient(180deg,#1e1e32,#151525);border-right:1px solid rgba(201,169,110,0.2);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sidebar .profile{padding:16px;border-bottom:1px solid rgba(201,169,110,0.15);text-align:center}
.sidebar .profile .avatar{width:48px;height:48px;border-radius:50%;border:2px solid #c9a96e;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;background:rgba(201,169,110,0.1);font-size:20px}
.sidebar .profile .name{font-size:14px;font-weight:700;color:#c9a96e}
.sidebar .profile .info{font-size:11px;color:#6b5b4e;margin-top:2px}
.sidebar .stats{padding:10px 16px;border-bottom:1px solid rgba(201,169,110,0.1)}
.sidebar .stats .srow{display:flex;justify-content:space-between;font-size:11px;color:#c9a96e;padding:2px 0}
.sidebar .nav{padding:8px 0;flex:1}
.nav-item{display:flex;align-items:center;gap:8px;padding:8px 16px;color:#6b5b4e;cursor:pointer;font-size:13px;border-left:3px solid transparent;text-decoration:none}
.nav-item:hover{color:#c9a96e;background:rgba(201,169,110,0.05)}
.nav-item.active{color:#c9a96e;background:rgba(201,169,110,0.08);border-left-color:#c9a96e}
.content{flex:1;padding:20px;overflow-y:auto}
.page-title{font-size:18px;color:#8b1a1a;margin-bottom:16px;padding-bottom:8px;border-bottom:2px solid #d4c5a9}
.card{background:white;border:1px solid #d4c5a9;border-radius:8px;padding:14px;margin-bottom:12px}
.card-title{font-size:13px;font-weight:600;color:#8b1a1a;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid #d4c5a9}
.btn{padding:8px 20px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;display:inline-block;text-decoration:none;text-align:center}
.btn-p{background:linear-gradient(135deg,#8b1a1a,#5c0e0e);color:#c9a96e}
.btn-g{background:linear-gradient(135deg,#c9a96e,#a08040);color:#1a1a2e}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.attr{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.attr-item{display:flex;justify-content:space-between;font-size:12px;padding:3px 6px;background:#fff8e7;border-radius:3px}
.attr-item .v{font-weight:600}
.ql{display:flex;gap:8px;flex-wrap:wrap}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{text-align:left;padding:6px 10px;font-size:11px;color:#6b5b4e;border-bottom:1px solid #d4c5a9}
.table td{padding:8px 10px;border-bottom:1px solid #d4c5a9}
.q-gray{color:#9e9e9e}.q-green{color:#4caf50}.q-blue{color:#2196f3}.q-purple{color:#9c27b0}.q-orange{color:#ff9800}
.tabs{display:flex;gap:0;margin-bottom:12px;border-bottom:2px solid #d4c5a9}
.tabs .tab{padding:6px 16px;cursor:pointer;font-size:13px;color:#6b5b4e;border-bottom:2px solid transparent;margin-bottom:-2px}
.tabs .tab.active{color:#8b1a1a;border-bottom-color:#8b1a1a;font-weight:600}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.sitem{background:white;border:1px solid #d4c5a9;border-radius:8px;padding:12px;text-align:center}
.slots{display:flex;gap:8px;margin-bottom:12px}
.slot{width:100px;height:80px;border:2px dashed #d4c5a9;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff8e7;font-size:12px}
.slot.f{border-style:solid;border-color:#c9a96e;background:white}
.mer{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.mer .col{flex:1;min-width:100px;background:white;border:1px solid #d4c5a9;border-radius:6px;padding:10px;text-align:center}
.mer .col .mn{font-weight:700;font-size:13px;color:#8b1a1a;margin-bottom:8px}
.dot{width:18px;height:18px;border-radius:50%;background:#e0e0e0;margin:3px auto;border:2px solid transparent}
.dot.ok{background:#c9a96e;border-color:#a08040}
.dot.cur{border-color:#8b1a1a;cursor:pointer}
.el{display:grid;grid-template-columns:160px 1fr;gap:16px}
.es{border:1px solid #d4c5a9;border-radius:6px;padding:10px}
.es .esi{padding:8px;margin-bottom:6px;background:white;border:1px dashed #d4c5a9;border-radius:4px;text-align:center;font-size:12px;cursor:pointer}
.elist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.ec{background:white;border:1px solid #d4c5a9;border-radius:6px;padding:10px}
.ec .nr{display:flex;justify-content:space-between;margin-bottom:4px}
.task-list{display:flex;flex-direction:column;gap:6px}
.ti{background:white;border:1px solid #d4c5a9;border-radius:6px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between}
.ti .prog{width:120px;height:4px;background:#e0e0e0;border-radius:2px;margin:4px 0}
.ti .prog .f{height:100%;background:#1565c0;border-radius:2px}
.price{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:#a08040;padding:4px 10px;background:#fff8e7;border-radius:10px;font-size:13px;margin:6px 0}
.auth-card{background:linear-gradient(180deg,#fff8e7,#f0e6d0);border:2px solid #c9a96e;border-radius:12px;padding:32px;width:340px;max-width:90vw;position:relative;overflow:hidden;text-align:center}
.auth-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#c9a96e,#8b1a1a,#c9a96e)}
.auth-card h1{font-size:28px;color:#8b1a1a;letter-spacing:6px;margin-bottom:4px}
.auth-card .sub{font-size:12px;color:#6b5b4e;letter-spacing:3px;margin-bottom:20px}
.auth-card label{display:block;font-size:12px;color:#6b5b4e;text-align:left;margin-bottom:3px}
.auth-card input{width:100%;padding:8px 12px;border:1px solid #d4c5a9;border-radius:5px;font-size:14px;background:white;outline:none;margin-bottom:14px}
.auth-card input:focus{border-color:#c9a96e}
.auth-card .btn{width:100%;margin-top:4px}
@media(max-width:768px){.sidebar{display:none}.grid{grid-template-columns:1fr}.el{grid-template-columns:1fr}}
</style>
<script src="/game/jwt/static/js/common.js?v=5"></script>
</head>
<body>
<div class="topbar">
<div class="logo">精武<span>堂</span></div>
<div class="player" id="topPlayerInfo">加载中...</div>
<button onclick="handleLogout()" style="background:transparent;border:1px solid #c9a96e;color:#c9a96e;padding:4px 12px;border-radius:4px;cursor:pointer;font-size:12px;margin-left:12px">退出</button>
</div>
<div class="game-body">
<div class="content" style="display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0">
<div style="background:linear-gradient(180deg,#fff8e7,#f0e6d0);border:2px solid #c9a96e;border-radius:12px;padding:32px;width:500px;max-width:90vw;position:relative;overflow:hidden;text-align:center">
<div style="position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#c9a96e,#8b1a1a,#c9a96e)"></div>
<h2 style="color:#8b1a1a;letter-spacing:4px;margin-bottom:16px">创建角色</h2>
<p style="font-size:13px;color:#6b5b4e;margin-bottom:16px">开始你的江湖之旅</p>
<div style="text-align:left">
<label style="font-size:12px;color:#6b5b4e">角色昵称</label>
<input style="width:100%;padding:8px 12px;border:1px solid #d4c5a9;border-radius:5px;font-size:14px;margin-bottom:14px" id="createName" placeholder="2-8 个中文字符" maxlength="8">
</div>
<label style="font-size:12px;color:#6b5b4e;display:block;text-align:left">选择门派</label>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0">
<div style="border:2px solid #8b1a1a;border-radius:6px;padding:10px;background:rgba(139,26,26,0.03);cursor:pointer"><div style="font-weight:700;color:#8b1a1a">少林</div><div style="font-size:11px;color:#666">外防血肉之盾</div><span style="font-size:10px;color:white;background:#1565c0;padding:1px 6px;border-radius:8px;display:inline-block;margin-top:4px">坦克</span></div>
<div style="border:2px solid #d4c5a9;border-radius:6px;padding:10px;cursor:pointer"><div style="font-weight:700;color:#8b1a1a">武当</div><div style="font-size:11px;color:#666">内功续航宗师</div><span style="font-size:10px;color:white;background:#c62828;padding:1px 6px;border-radius:8px;display:inline-block;margin-top:4px">内功</span></div>
<div style="border:2px solid #d4c5a9;border-radius:6px;padding:10px;cursor:pointer"><div style="font-weight:700;color:#8b1a1a">峨眉</div><div style="font-size:11px;color:#666">治疗辅助圣手</div><span style="font-size:10px;color:white;background:#2e7d32;padding:1px 6px;border-radius:8px;display:inline-block;margin-top:4px">辅助</span></div>
<div style="border:2px solid #d4c5a9;border-radius:6px;padding:10px;cursor:pointer"><div style="font-weight:700;color:#8b1a1a">唐门</div><div style="font-size:11px;color:#666">暴击刺客</div><span style="font-size:10px;color:white;background:#6a1b9a;padding:1px 6px;border-radius:8px;display:inline-block;margin-top:4px">刺客</span></div>
<div style="border:2px solid #d4c5a9;border-radius:6px;padding:10px;cursor:pointer"><div style="font-weight:700;color:#8b1a1a">丐帮</div><div style="font-size:11px;color:#666">均衡持续作战</div><span style="font-size:10px;color:white;background:#f57f17;padding:1px 6px;border-radius:8px;display:inline-block;margin-top:4px">均衡</span></div>
<div style="border:2px solid #d4c5a9;border-radius:6px;padding:10px;cursor:pointer"><div style="font-weight:700;color:#8b1a1a">明教</div><div style="font-size:11px;color:#666">暴力输出狂战</div><span style="font-size:10px;color:white;background:#c62828;padding:1px 6px;border-radius:8px;display:inline-block;margin-top:4px">输出</span></div>
</div>
<div id="createError" style="text-align:center;font-size:13px;color:#c0392b;margin:8px 0;display:none"></div>
<a href="#" class="btn btn-p" style="width:100%;margin-top:8px" id="createBtn" onclick="handleCreate();return false">确认创建</a>
</div></div></div></div><script>
(function(){
  var grids=document.querySelectorAll('[style*="grid-template-columns:1fr 1fr 1fr"]');
  if(grids.length<1)return;
  var grid=grids[0];
  var sel=1;
  grid.querySelectorAll(':scope > div').forEach(function(d,i){
    d.style.cursor='pointer';
    d.onclick=function(){
      grid.querySelectorAll(':scope > div').forEach(function(s){s.style.borderColor='#d4c5a9';s.style.background='';});
      d.style.borderColor='#8b1a1a';d.style.background='rgba(139,26,26,0.03)';
      sel=i+1;
    };
  });
  window.handleCreate=function(){
    var name=document.getElementById('createName').value.trim();
    if(!name||name.length<2){var e=document.getElementById('createError');e.textContent='昵称至少2个字符';e.style.display='block';return;}
    var gender=1;
    var uid=parseInt(localStorage.getItem('user_id'));if(!uid||isNaN(uid)){var e=document.getElementById('createError');e.textContent='登录已过期，请重新登录';e.style.display='block';return;}
    var btn=document.getElementById('createBtn');btn.textContent='创建中...';btn.style.opacity='0.5';
    fetch('/game/jwt/api/v1/player/create',{
      method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+localStorage.getItem('token')},
      body:JSON.stringify({name:name,gender:gender,school_id:sel,user_id:uid})
    }).then(function(r){return r.json()}).then(function(d){
      if(d.code===0){localStorage.setItem('player_id',d.data.player_id);window.location.href='/game/jwt/game.html';}
      else{var e=document.getElementById('createError');e.textContent=d.message||'创建失败';e.style.display='block';btn.textContent='确认创建';btn.style.opacity='1';}
    }).catch(function(){var e=document.getElementById('createError');e.textContent='网络异常';e.style.display='block';btn.textContent='确认创建';btn.style.opacity='1';});
  };
})();
</script>
<script>
var token=localStorage.getItem('token');if(!token){window.location.href='/game/jwt/';}var uid=parseInt(localStorage.getItem('user_id'));if(uid){fetch('/game/jwt/api/v1/player/by_user?user_id='+uid,{headers:{'Authorization':'Bearer '+token}}).then(function(r){return r.json()}).then(function(d){if(d.data&&d.data.player_id){localStorage.setItem('player_id',d.data.player_id);window.location.href='/game/jwt/game.html';}});}
function handleLogout(){sessionStorage.removeItem('gcState');localStorage.removeItem('token');localStorage.removeItem('user_id');localStorage.removeItem('player_id');window.location.href='/game/jwt/';}
var pid=localStorage.getItem('player_id')||1;
fetch('/game/jwt/api/v1/player/info?player_id='+pid,{headers:{'Authorization':'Bearer '+token}})
.then(function(r){return r.json()})
.then(function(d){
  if(d.code!==0)return;
  var p=d.data;
  document.getElementById('topPlayerInfo').innerHTML=renderTopPlayer(p);
  var el=function(i){return document.getElementById(i)};
  if(el('sName'))el('sName').innerHTML=renderPlayerName(p);
  if(el('sInfo'))el('sInfo').textContent='Lv.'+(p.level||1)+' | 战力 '+(p.combat_power||0);
  if(el('sHp'))el('sHp').textContent=(p.hp||0)+'/'+(p.max_hp||0);
  if(el('sMp'))el('sMp').textContent=(p.mp||0)+'/'+(p.max_mp||0);
  if(el('sStamina'))el('sStamina').textContent=p.stamina||0;
});
</script>
</body></html>
