<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei",sans-serif;background:#f5f0e8;color:#2c1810;height:100vh;display:flex;flex-direction:column}
.topbar{height:50px;background:linear-gradient(90deg,#1a1a2e,#2c2c44);border-bottom:2px solid #c9a96e;display:flex;align-items:center;padding:0 20px;flex-shrink:0}

.game-body{display:flex;flex:1;overflow:hidden}
.sidebar{width:200px;background:linear-gradient(180deg,#1e1e32,#151525);border-right:1px solid rgba(201,169,110,0.2);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sidebar .profile{padding:16px;border-bottom:1px solid rgba(201,169,110,0.15);text-align:center}
.sidebar .profile .avatar{width:48px;height:48px;border-radius:50%;border:2px solid #c9a96e;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;background:rgba(201,169,110,0.1);font-size:20px}
.sidebar .profile .name{font-size:14px;font-weight:700;color:#c9a96e}
.sidebar .profile .info{font-size:11px;color:#6b5b4e;margin-top:2px}
.sidebar .stats{padding:10px 16px;border-bottom:1px solid rgba(201,169,110,0.1)}
.sidebar .stats .srow{display:flex;justify-content:space-between;font-size:11px;color:#c9a96e;padding:2px 0}
.sidebar .nav{padding:8px 0;flex:1}
.nav-item{display:flex;align-items:center;gap:8px;padding:8px 16px;color:#6b5b4e;cursor:pointer;font-size:13px;border-left:3px solid transparent;text-decoration:none}
.nav-item:hover{color:#c9a96e;background:rgba(201,169,110,0.05)}
.nav-item.active{color:#c9a96e;background:rgba(201,169,110,0.08);border-left-color:#c9a96e}
.content{flex:1;padding:20px;overflow-y:auto}
.page-title{font-size:18px;color:#8b1a1a;margin-bottom:16px;padding-bottom:8px;border-bottom:2px solid #d4c5a9}
.card{background:white;border:1px solid #d4c5a9;border-radius:8px;padding:14px;margin-bottom:12px}
.card-title{font-size:13px;font-weight:600;color:#8b1a1a;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid #d4c5a9}
.btn{padding:8px 20px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;display:inline-block;text-decoration:none;text-align:center}
.btn-p{background:linear-gradient(135deg,#8b1a1a,#5c0e0e);color:#c9a96e}
.btn-g{background:linear-gradient(135deg,#c9a96e,#a08040);color:#1a1a2e}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.attr{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.attr-item{display:flex;justify-content:space-between;font-size:12px;padding:3px 6px;background:#fff8e7;border-radius:3px}
.attr-item .v{font-weight:600}
.ql{display:flex;gap:8px;flex-wrap:wrap}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{text-align:left;padding:6px 10px;font-size:11px;color:#6b5b4e;border-bottom:1px solid #d4c5a9}
.table td{padding:8px 10px;border-bottom:1px solid #d4c5a9}
.q-gray{color:#9e9e9e}.q-green{color:#4caf50}.q-blue{color:#2196f3}.q-purple{color:#9c27b0}.q-orange{color:#ff9800}.q-red{color:#e53935}
.tabs{display:flex;gap:0;margin-bottom:12px;border-bottom:2px solid #d4c5a9}
.tabs .tab{padding:6px 16px;cursor:pointer;font-size:13px;color:#6b5b4e;border-bottom:2px solid transparent;margin-bottom:-2px}
.tabs .tab.active{color:#8b1a1a;border-bottom-color:#8b1a1a;font-weight:600}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.sitem{background:white;border:1px solid #d4c5a9;border-radius:8px;padding:12px;text-align:center}
.slots{display:flex;gap:8px;margin-bottom:12px}
.slot{width:100px;height:80px;border:2px dashed #d4c5a9;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff8e7;font-size:12px}
.slot.f{border-style:solid;border-color:#c9a96e;background:white}
.mer{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.mer .col{flex:1;min-width:100px;background:white;border:1px solid #d4c5a9;border-radius:6px;padding:10px;text-align:center}
.mer .col .mn{font-weight:700;font-size:13px;color:#8b1a1a;margin-bottom:8px}
.dot{width:18px;height:18px;border-radius:50%;background:#e0e0e0;margin:3px auto;border:2px solid transparent}
.dot.ok{background:#c9a96e;border-color:#a08040}
.dot.cur{border-color:#8b1a1a;cursor:pointer}
.el{display:grid;grid-template-columns:160px 1fr;gap:16px}
.es{border:1px solid #d4c5a9;border-radius:6px;padding:10px}
.es .esi{padding:8px;margin-bottom:6px;background:white;border:1px dashed #d4c5a9;border-radius:4px;text-align:center;font-size:12px;cursor:pointer}
.elist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.ec{background:white;border:1px solid #d4c5a9;border-radius:6px;padding:10px}
.ec .nr{display:flex;justify-content:space-between;margin-bottom:4px}
.task-list{display:flex;flex-direction:column;gap:6px}
.ti{background:white;border:1px solid #d4c5a9;border-radius:6px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between}
.ti .prog{width:120px;height:4px;background:#e0e0e0;border-radius:2px;margin:4px 0}
.ti .prog .f{height:100%;background:#1565c0;border-radius:2px}
.price{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:#a08040;padding:4px 10px;background:#fff8e7;border-radius:10px;font-size:13px;margin:6px 0}
.auth-card{background:linear-gradient(180deg,#fff8e7,#f0e6d0);border:2px solid #c9a96e;border-radius:12px;padding:32px;width:340px;max-width:90vw;position:relative;overflow:hidden;text-align:center}
.auth-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#c9a96e,#8b1a1a,#c9a96e)}
.auth-card h1{font-size:28px;color:#8b1a1a;letter-spacing:6px;margin-bottom:4px}
.auth-card .sub{font-size:12px;color:#6b5b4e;letter-spacing:3px;margin-bottom:20px}
.auth-card label{display:block;font-size:12px;color:#6b5b4e;text-align:left;margin-bottom:3px}
.auth-card input{width:100%;padding:8px 12px;border:1px solid #d4c5a9;border-radius:5px;font-size:14px;background:white;outline:none;margin-bottom:14px}
.auth-card input:focus{border-color:#c9a96e}
.auth-card .btn{width:100%;margin-top:4px}
@media(max-width:768px){.sidebar{display:none}.grid{grid-template-columns:1fr}.el{grid-template-columns:1fr}}
</style>

<div style="display:flex;gap:12px;align-items:center;margin-bottom:8px">
<div style="font-size:36px" id="mAvatar">*</div>
<div><div style="font-size:16px;font-weight:700" id="mName">-</div><div style="font-size:12px;color:#666" id="mInfo">-</div></div></div>
<div style="margin-top:4px"><span id="schoolTag" style="display:inline-block;padding:2px 10px;border-radius:3px;font-size:12px;background:#fff8e7;border:1px solid #c9a96e;color:#8b1a1a">-</span></div>

<div class="attr-item"><span>力量</span><span class="v" id="attrStrength">-</span></div>

</div>

<div style="height:8px;background:#e0e0e0;border-radius:4px;overflow:hidden;margin:6px 0;position:relative"><div id="expFill" style="height:100%;background:linear-gradient(90deg,#8b1a1a,#c9a96e);border-radius:4px;width:0%"></div></div>

<button class="add-btn" id="addAgi" onclick="window.alloc('agility')" style="background:#8b1a1a;color:#c9a96e;border:none;border-radius:3px;padding:2px 8px;cursor:pointer;font-size:11px">身法+</button>
<button class="add-btn" id="addCon" onclick="window.alloc('constitution')" style="background:#8b1a1a;color:#c9a96e;border:none;border-radius:3px;padding:2px 8px;cursor:pointer;font-size:11px">体质+</button>
<button class="add-btn" id="addSpi" onclick="window.alloc('spirit')" style="background:#8b1a1a;color:#c9a96e;border:none;border-radius:3px;padding:2px 8px;cursor:pointer;font-size:11px">内力+</button>
</div>

<script>
function handleLogout(){sessionStorage.removeItem('gcState');localStorage.removeItem('token');localStorage.removeItem('user_id');localStorage.removeItem('player_id');window.location.href='/game/jwt/';}window.alloc=function(attr){var data={player_id:pid};data[attr]=1;fetch('/game/jwt/api/v1/player/allocate_attr',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+localStorage.getItem('token')},body:JSON.stringify(data)}).then(function(r){return r.json()}).then(function(d){if(d.code===0){window.location.reload();}else{showToast(d.message||'分配失败','error');}}).catch(function(){showToast('网络异常','error');});};
var token=localStorage.getItem('token');if(!token){window.location.href='/game/jwt/';}
var pid=localStorage.getItem('player_id')||1;fetch('/game/jwt/api/v1/player/info?player_id='+pid,{headers:{'Authorization':'Bearer '+token}})
.then(function(r){return r.json()})
.then(function(d){
  if(d.code!==0){
    if(d.code===2003){window.location.href='/game/jwt/create.html';return;}
    var errEl=document.getElementById("topPlayerInfo");if(errEl){errEl.textContent="服务器异常，请刷新重试";}
    return;
  }
    var p=d.data;
  document.getElementById("topPlayerInfo").innerHTML=renderTopPlayer(p);
  var el=function(i){return document.getElementById(i)};
  if(el("sName"))el("sName").innerHTML=renderPlayerName(p);
  if(el("sInfo"))el("sInfo").textContent="Lv."+(p.level||1)+" | 战力 "+(p.combat_power||0);
  if(el("sHp"))el("sHp").textContent=(p.hp||0)+"/"+(p.max_hp||0);
  if(el("sMp"))el("sMp").textContent=(p.mp||0)+"/"+(p.max_mp||0);
  if(el("sStamina"))el("sStamina").textContent=p.stamina||0;
  if(el("schoolTag"))el("schoolTag").textContent=p.school_name||"-";
  if(el("attrStrength"))el("attrStrength").textContent=p.strength||10;
  if(el("attrAgility"))el("attrAgility").textContent=p.agility||10;
  if(el("attrConstitution"))el("attrConstitution").textContent=p.constitution||10;
  if(el("attrSpirit"))el("attrSpirit").textContent=p.spirit||10;
  if(el("freePointsDisplay"))el("freePointsDisplay").innerHTML="自由属性点: <strong>"+(p.free_points||0)+"</strong>";
  if(el("expFill")){var pct=Math.min(100,(p.exp||0)/(p.exp_needed||1)*100);el("expFill").style.width=pct+"%";}
  if(el("expText"))el("expText").textContent=(p.exp||0)+" / "+(p.exp_needed||0);
  if(el("mName"))el("mName").textContent=p.name||"少侠";
  if(el("mInfo"))el("mInfo").textContent="Lv."+(p.level||1)+" | 战力 "+(p.combat_power||0);
  if(el("mGold"))el("mGold").textContent=p.gold||0;
  if(el("mIngot"))el("mIngot").textContent=p.ingot||0;
  if(el("mRep"))el("mRep").textContent=p.reputation||0;
  if(el("sHp2"))el("sHp2").textContent=(p.hp||0)+"/"+(p.max_hp||0);
  if(el("sMp2"))el("sMp2").textContent=(p.mp||0)+"/"+(p.max_mp||0);
  if(el("sStamina2"))el("sStamina2").textContent=(p.stamina||0)+"/100";
  if(p.free_points>0 && el("addBtns"))el("addBtns").style.display="flex";
  })
  .catch(function(){});


</script>
