<div id="equipContent" style="display:none">
<div class="el"><div class="es"><div style="font-weight:600;font-size:13px;color:#8b1a1a;margin-bottom:6px">当前装备</div><div id="equippedSlots"></div></div>
<div class="elist" id="bagItems"></div></div></div>

<script>
var pid=localStorage.getItem('player_id')||1;
var equipItems=[];
var qualityNames=Array("","普通","优秀","精良","史诗","传说","红装");
function loadEquipment(){
  document.getElementById('equipLoading').style.display='block';document.getElementById('equipContent').style.display='none';
  fetch('/jwt/api/v1/equipment/list?player_id='+pid,{headers:{'Authorization':'Bearer '+localStorage.getItem('token')}})
  .then(function(r){return r.json()}).then(function(d){
    document.getElementById('equipLoading').style.display='none';document.getElementById('equipContent').style.display='block';
    if(d.code!==0){showToast(d.message||'加载失败','error');return;}
    var items=d.data||[];
    equipItems=items;
    var equipped=items.filter(function(i){return i.is_equipped===1});
    var bag=items.filter(function(i){return i.is_equipped===0});
        // 动态显示已装备物品，支持任意槽位值
    var slotNames={1:"武器",2:"头盔",3:"衣甲",4:"腰带",5:"靴子",6:"项链"};
    var eh="";
    // 先显示标准槽位 (1-4)
    for(var i=1;i<=6;i++){
      var eq=equipped.find(function(e){return e.slot===i});
      eh+='<div class="esi" id="'+(eq?'eq-item-'+eq.id:'')+'" style="'+(eq?'border-style:solid;border-color:#c9a96e':'')+'">';
      if(eq){
        eh+='<div style="font-weight:600" class="'+qCls(eq.quality)+'">'+eq.name+'</div>';
        eh+='<div style="font-size:11px;color:#666">+'+(eq.enhance_level||0)+' '+(Array("","普通","优秀","精良","史诗","传说","红装")[eq.quality]||"未知")+'</div>';
        eh+=statsHtml(eq)+affixHtml(eq);
        eh+='<div style="margin-top:4px;display:flex;gap:4px">';
        eh+='<span class="btn" style="padding:3px 8px;font-size:11px;background:linear-gradient(135deg,#8b1a1a,#5c0e0e);color:#c9a96e;border:none;border-radius:4px;cursor:pointer" onclick="doAction('+eq.id+',\'unequip\')">卸下</span>';
        eh+='<span class="btn" style="padding:3px 8px;font-size:11px;background:linear-gradient(135deg,#2d7d46,#1e5c32);color:#c9a96e;border:none;border-radius:4px;cursor:pointer" onclick="doAction('+eq.id+',\'enhance\')">强化</span>';
        eh+="</div>";
      }else{
        eh+='<div style="color:#999">'+(slotNames[i]||"槽位"+i)+'</div>';
      }
      eh+="</div>";
    }
    // 显示非标准槽位的已装备物品
    for(var j=0;j<equipped.length;j++){
      var e=equipped[j];
      if(e.slot<1||e.slot>6){
        eh+='<div class="esi" id="eq-item-'+e.id+'" style="border-style:solid;border-color:#c9a96e">';
        eh+='<div style="font-weight:600" class="'+qCls(e.quality)+'">'+e.name+'</div>';
        eh+='<div style="font-size:11px;color:#666">槽位'+e.slot+' | +'+(e.enhance_level||0)+' '+(Array("","普通","优秀","精良","史诗","传说","红装")[e.quality]||"未知")+'</div>';
        eh+=statsHtml(e)+affixHtml(e);
        eh+='<div style="margin-top:4px;display:flex;gap:4px">';
        eh+='<span class="btn" style="padding:3px 8px;font-size:11px;background:linear-gradient(135deg,#8b1a1a,#5c0e0e);color:#c9a96e;border:none;border-radius:4px;cursor:pointer" onclick="doAction('+e.id+',\'unequip\')">卸下</span>';
        eh+='<span class="btn" style="padding:3px 8px;font-size:11px;background:linear-gradient(135deg,#2d7d46,#1e5c32);color:#c9a96e;border:none;border-radius:4px;cursor:pointer" onclick="doAction('+e.id+',\'enhance\')">强化</span>';
        eh+="</div></div>";
      }
    }
    document.getElementById('equippedSlots').innerHTML=eh;
    var bh='';
    for(var i=0;i<bag.length;i++){
      var e=bag[i];
      bh+='<div class="ec" id="bag-item-'+e.id+'"><div style="font-weight:600" class="'+qCls(e.quality)+'">'+e.name+'</div>';
      bh+='<div class="nr"><span style="font-size:11px;color:#666">'+(qualityNames[e.quality]||'未知')+'</span><span style="font-size:11px;color:#666">+'+e.enhance_level+'</span></div>'; bh+='<div style="font-size:11px;color:#a08040;margin-top:2px">售价 '+e.sell_price+' 金币</div>';
      bh+=statsHtml(e)+affixHtml(e);
      bh+='<div style="margin-top:6px;display:flex;gap:4px"><span class="btn" style="padding:3px 8px;font-size:11px;background:linear-gradient(135deg,#8b1a1a,#5c0e0e);color:#c9a96e;border:none;border-radius:4px;cursor:pointer" onclick="doAction('+e.id+',&#39;equip&#39;)">装备</span><span class="btn" style="padding:3px 8px;font-size:11px;background:linear-gradient(135deg,#2d7d46,#1e5c32);color:#c9a96e;border:none;border-radius:4px;cursor:pointer" onclick="doAction('+e.id+',&#39;enhance&#39;)">强化</span><span class="btn" style="padding:3px 8px;font-size:11px;background:linear-gradient(135deg,#7f8c8d,#555);color:#c9a96e;border:none;border-radius:4px;cursor:pointer" onclick="doAction('+e.id+',&#39;sell&#39;)">出售</span></div></div>';
    }
    document.getElementById('bagItems').innerHTML=bh||'<div style="color:#999;font-size:13px">暂无装备</div>';
  }).catch(function(){document.getElementById('equipLoading').style.display='none';showToast('网络异常','error');});
}
function qCls(q){
  return ["","q-gray","q-green","q-blue","q-purple","q-orange","q-red"][q]||"q-gray";
}
var statNames={attack:'外功攻击',defense:'外功防御',magic_attack:'内功攻击',magic_defense:'内功防御',hp:'生命',mp:'内力',speed:'速度'};
function statsHtml(e){
  var s=e.stats||{};var h='<div style="margin-top:4px;font-size:11px;color:#4a3f35">';
  for(var k in statNames){var v=s[k]||0;if(v>0){h+=statNames[k]+' +'+v+'&nbsp;&nbsp;';}}
  h+='</div>';return h;
}
function affixHtml(e){
  var aff=e.affixes||[];if(aff.length===0){return '';}
  var h='<div style="margin-top:2px;font-size:11px;color:#2d7d46">';
  for(var i=0;i<aff.length;i++){h+=aff[i].name+' +'+aff[i].value+'&nbsp;&nbsp;';}
  h+='</div>';return h;
}
function doAction(id,action){
  var urls={equip:'/jwt/api/v1/equipment/equip',unequip:'/jwt/api/v1/equipment/unequip',enhance:'/jwt/api/v1/equipment/enhance',sell:'/jwt/api/v1/equipment/sell'};
  fetch((urls[action]||urls.equip)+'?player_id='+pid,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+localStorage.getItem('token')},body:JSON.stringify({equip_id:id})})
  .then(function(r){return r.json()}).then(function(d){
    if(d.code===0){handleActionResult(id,action,d);}
    else{showToast(d.message||'操作失败','error');}
  }).catch(function(){showToast('网络异常','error');});
}
loadEquipment();

function handleActionResult(id, action, d){
  if(action==='enhance'){
    var oldItem=equipItems.find(function(x){return x.id===id;});
    var oldLevel=oldItem?oldItem.enhance_level:0;
    var newItem=d.data&&d.data.item;
    if(newItem){
      var idx=equipItems.findIndex(function(x){return x.id===id;});
      if(idx>=0){equipItems[idx]=newItem;}
      oldItem=newItem;
    }
    var newLevel=oldItem?oldItem.enhance_level:(d.data&&d.data.new_level!==undefined?d.data.new_level:oldLevel);
    var delta=newLevel-oldLevel;
    var resultText=d.data&&d.data.success?'强化成功 +1':(delta<0?'强化失败 -1':'强化失败');
    if(oldItem){
      var isEquipped=oldItem.is_equipped===1;
      var cardId=isEquipped?('eq-item-'+id):('bag-item-'+id);
      var cardEl=document.getElementById(cardId);
      if(cardEl){cardEl.innerHTML=isEquipped?equippedItemHtml(oldItem,resultText):bagItemHtml(oldItem,resultText);}
    }
    return;
  }
  if(action==='sell'){
    var gained=d.data&&d.data.gold_gained!==undefined?d.data.gold_gained:0;
    equipItems=equipItems.filter(function(x){return x.id!==id;});
    var cardEl=document.getElementById('bag-item-'+id);
    if(cardEl){cardEl.parentNode.removeChild(cardEl);}
    showToast('出售成功，获得 '+gained+' 金币','success');
    return;
  }
  loadEquipment();
}

function equippedItemHtml(e,resultText){
  var h='';
  h+='<div style="font-weight:600" class="'+qCls(e.quality)+'">'+e.name+'</div>';
  h+='<div style="font-size:11px;color:#666">+'+(e.enhance_level||0)+' '+(qualityNames[e.quality]||'未知')+'</div>';
  h+=statsHtml(e)+affixHtml(e);
  h+='<div style="margin-top:4px;display:flex;gap:4px">';
  h+='<span class="btn" style="padding:3px 8px;font-size:11px;background:linear-gradient(135deg,#8b1a1a,#5c0e0e);color:#c9a96e;border:none;border-radius:4px;cursor:pointer" onclick="doAction('+e.id+',\'unequip\')">卸下</span>';
  h+='<span class="btn" style="padding:3px 8px;font-size:11px;background:linear-gradient(135deg,#2d7d46,#1e5c32);color:#c9a96e;border:none;border-radius:4px;cursor:pointer" onclick="doAction('+e.id+',\'enhance\')">强化</span>';
  h+='</div>';
  if(resultText){
    h+='<div style="margin-top:4px;font-size:11px;color:'+(resultText.indexOf('+1')>=0?'#2d7d46':'#e53935')+'">'+resultText+'</div>';
  }
  return h;
}

function bagItemHtml(e,resultText){
  var h='';
  h+='<div style="font-weight:600" class="'+qCls(e.quality)+'">'+e.name+'</div>';
  h+='<div class="nr"><span style="font-size:11px;color:#666">'+(qualityNames[e.quality]||'未知')+'</span><span style="font-size:11px;color:#666">+'+e.enhance_level+'</span></div>';
  h+=statsHtml(e)+affixHtml(e);
  h+='<div style="font-size:11px;color:#a08040;margin-top:2px">售价 '+e.sell_price+' 金币</div>';
  h+='<div style="margin-top:6px;display:flex;gap:4px">';
  h+='<span class="btn" style="padding:3px 8px;font-size:11px;background:linear-gradient(135deg,#8b1a1a,#5c0e0e);color:#c9a96e;border:none;border-radius:4px;cursor:pointer" onclick="doAction('+e.id+',\'equip\')">装备</span>';
  h+='<span class="btn" style="padding:3px 8px;font-size:11px;background:linear-gradient(135deg,#2d7d46,#1e5c32);color:#c9a96e;border:none;border-radius:4px;cursor:pointer" onclick="doAction('+e.id+',\'enhance\')">强化</span>';
  h+='<span class="btn" style="padding:3px 8px;font-size:11px;background:linear-gradient(135deg,#7f8c8d,#555);color:#c9a96e;border:none;border-radius:4px;cursor:pointer;margin-left:4px" onclick="doAction('+e.id+',\'sell\')">出售</span>';
  h+='</div>';
  if(resultText){
    h+='<div style="margin-top:4px;font-size:11px;color:'+(resultText.indexOf('+1')>=0?'#2d7d46':'#e53935')+'">'+resultText+'</div>';
  }
  return h;
}
