<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录处理中 | 精武堂</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#1a1a2e,#2a1a1a,#1a1a2e);font-family:"Microsoft YaHei",sans-serif}
.card{background:linear-gradient(180deg,#fff8e7,#f0e6d0);border:2px solid #c9a96e;border-radius:12px;padding:40px;width:340px;max-width:90vw;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
h1{font-size:28px;color:#8b1a1a;letter-spacing:6px;margin-bottom:16px}
p{font-size:14px;color:#6b5b4e}
.error{color:#c0392b}
a{display:inline-block;margin-top:18px;color:#c9a96e;text-decoration:none;font-size:13px}
.spinner{width:28px;height:28px;margin:18px auto;border:3px solid #d4c5a9;border-top-color:#8b1a1a;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
<h1>精武堂</h1>
<div class="spinner" id="spinner"></div>
<p id="status">登录处理中...</p>
<a id="backLink" href="/game/jwt/" style="display:none">返回登录</a>
</div>
<script>
var qs = new URLSearchParams(window.location.search);
var token = qs.get('token');
var userId = qs.get('user_id');
var error = qs.get('error');
var statusEl = document.getElementById('status');
var spinner = document.getElementById('spinner');
var backLink = document.getElementById('backLink');

function fail(msg) {
    statusEl.textContent = msg || '登录失败，请重试';
    statusEl.className = 'error';
    spinner.style.display = 'none';
    backLink.style.display = 'inline-block';
}

if (error) {
    fail(error);
} else if (!token || !userId) {
    fail('登录回调参数缺失');
} else {
    localStorage.setItem('token', token);
    localStorage.setItem('user_id', userId);
    sessionStorage.removeItem('gcState');
    fetch('/game/jwt/api/v1/player/by_user?user_id=' + userId, {
        headers: {'Authorization': 'Bearer ' + token}
    })
    .then(function(r) { return r.json(); })
    .then(function(d) {
        if (d.code === 0 && d.data && d.data.player_id) {
            localStorage.setItem('player_id', d.data.player_id);
            window.location.href = '/game/jwt/game.html';
        } else {
            window.location.href = '/game/jwt/create.html';
        }
    })
    .catch(function() { fail('网络异常，请稍后重试'); });
}
</script>
</body>
</html>
