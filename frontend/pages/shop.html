<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商城 | 精武堂</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei",sans-serif;background:#f5f0e8;color:#2c1810;height:100vh;display:flex;flex-direction:column}
.topbar{height:50px;background:linear-gradient(90deg,#1a1a2e,#2c2c44);border-bottom:2px solid #c9a96e;display:flex;align-items:center;padding:0 20px;flex-shrink:0}
.topbar .logo{font-size:18px;font-weight:700;color:#c9a96e;letter-spacing:4px;margin-right:24px}
.topbar .player{margin-left:auto;color:#c9a96e;font-size:13px}
.game-body{display:flex;flex:1;overflow:hidden}
.sidebar{width:200px;background:linear-gradient(180deg,#1e1e32,#151525);border-right:1px solid rgba(201,169,110,0.2);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sidebar .profile{padding:16px;border-bottom:1px solid rgba(201,169,110,0.15);text-align:center}
.sidebar .profile .avatar{width:48px;height:48px;border-radius:50%;border:2px solid #c9a96e;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;background:rgba(201,169,110,0.1);font-size:20px}
.sidebar .profile .name{font-size:14px;font-weight:700;color:#c9a96e}
.sidebar .profile .info{font-size:11px;color:#6b5b4e;margin-top:2px}
.sidebar .stats{padding:10px 16px;border-bottom:1px solid rgba(201,169,110,0.1)}
.sidebar .stats .srow{display:flex;justify-content:space-between;font-size:11px;color:#c9a96e;padding:2px 0}
.sidebar .nav{padding:8px 0;flex:1}
.nav-item{display:flex;align-items:center;gap:8px;padding:8px 16px;color:#6b5b4e;cursor:pointer;font-size:13px;border-left:3px solid transparent;text-decoration:none}
.nav-item:hover{color:#c9a96e;background:rgba(201,169,110,0.05)}
.nav-item.active{color:#c9a96e;background:rgba(201,169,110,0.08);border-left-color:#c9a96e}
.content{flex:1;padding:20px;overflow-y:auto}
.page-title{font-size:18px;color:#8b1a1a;margin-bottom:16px;padding-bottom:8px;border-bottom:2px solid #d4c5a9}
.card{background:white;border:1px solid #d4c5a9;border-radius:8px;padding:14px;margin-bottom:12px}
.card-title{font-size:13px;font-weight:600;color:#8b1a1a;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid #d4c5a9}
.btn{padding:8px 20px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;display:inline-block;text-decoration:none;text-align:center}
.btn-p{background:linear-gradient(135deg,#8b1a1a,#5c0e0e);color:#c9a96e}
.btn-g{background:linear-gradient(135deg,#c9a96e,#a08040);color:#1a1a2e}
.tabs{display:flex;gap:0;margin-bottom:12px;border-bottom:2px solid #d4c5a9}
.tabs .tab{padding:6px 16px;cursor:pointer;font-size:13px;color:#6b5b4e;border-bottom:2px solid transparent;margin-bottom:-2px}
.tabs .tab.active{color:#8b1a1a;border-bottom-color:#8b1a1a;font-weight:600}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.sitem{background:white;border:1px solid #d4c5a9;border-radius:8px;padding:12px;text-align:center}
.sitem .nm{font-weight:700;color:#8b1a1a;font-size:14px;margin-top:6px}
.sitem .desc{font-size:11px;color:#999;margin:2px 0}
.sitem .price{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:#a08040;padding:4px 10px;background:#fff8e7;border-radius:10px;font-size:13px;margin:6px 0}
.sitem .limit{font-size:10px;color:#999}
.inv-item{display:flex;align-items:center;justify-content:space-between;border:1px solid #d4c5a9;border-radius:6px;padding:8px 12px;margin-bottom:6px;font-size:12px}
.inv-item .btns{display:flex;gap:6px}
@media(max-width:768px){.sidebar{display:none}}
</style>
<script src="/game/jwt/static/js/common.js?v=4"></script>
</head>
<body>
<div class="topbar">
<a href="game.html" style="color:inherit;text-decoration:none"><div class="logo">精武<span>堂</span></div></a>
<div class="player" id="topPlayerInfo">加载中...</div>
<button onclick="handleLogout()" style="background:transparent;border:1px solid #c9a96e;color:#c9a96e;padding:4px 12px;border-radius:4px;cursor:pointer;font-size:12px;margin-left:12px">退出</button>
</div>
<div class="game-body">
<div class="sidebar">
<div class="profile"><div class="avatar">*</div><div class="name" id="sName">-</div><div class="info" id="sInfo">-</div></div>
<div class="stats">
<div class="srow"><span>HP</span><span id="sHp">-</span></div>
<div class="srow"><span>MP</span><span id="sMp">-</span></div>
<div class="srow"><span>体力</span><span id="sStamina">-</span></div>
</div>
<div class="nav">
<a class="nav-item " href="battle.html">历练</a>
<a class="nav-item " href="equipment.html">装备</a>
<a class="nav-item " href="skills.html">技能</a>
<a class="nav-item " href="meridians.html">经脉</a>
<a class="nav-item " href="tasks.html">任务</a>
<a class="nav-item " href="ranking.html">排行</a>
<a class="nav-item active" href="shop.html">商城</a>
<a class="nav-item " href="friend.html">好友</a>
<a class="nav-item " href="guild.html">帮派</a>
<a class="nav-item " href="equip-guide.html">装备说明</a>
</div>
</div>
<div class="content">
<div class="page-title">商城</div>
<div id="moneyBar" style="display:flex;gap:12px;font-size:12px;color:#666;margin-bottom:8px"></div>
<div class="tabs" id="catTabs">
<div class="tab active" data-cat="0">全部</div>
<div class="tab" data-cat="1">消耗品</div>
<div class="tab" data-cat="2">强化材料</div>
<div class="tab" data-cat="3">外观</div>
<div class="tab" data-cat="4">VIP</div>
</div>
<div id="shopLoading" style="font-size:12px;color:#666">加载中...</div>
<div class="sgrid" id="shopList"></div>
<div class="card" style="margin-top:16px">
<div class="card-title">我的物品</div>
<div id="invList">加载中...</div>
</div>
<div id="shopError" style="text-align:center;font-size:13px;color:#c0392b;margin:8px 0;display:none"></div>
<script>
var pid=localStorage.getItem('player_id')||1;
var priceNames={1:"金币",2:"元宝",3:"修为",4:"帮贡"};
var curCat=0;

function loadShop(){
  document.getElementById('shopLoading').style.display='block';
  fetch('/game/jwt/api/v1/shop/list?category='+curCat,{headers:{'Authorization':'Bearer '+localStorage.getItem('token')}})
  .then(function(r){return r.json()}).then(function(d){
    document.getElementById('shopLoading').style.display='none';
    if(d.code!==0){showErr(d.message||'加载失败');return;}
    var items=d.data||[];
    var h='';
    for(var i=0;i<items.length;i++){
      var it=items[i];
      h+='<div class="sitem"><div class="nm">'+it.name+'</div>';
      h+='<div class="desc">'+it.description+'</div>';
      h+='<div class="price">'+it.price+' '+it.price_type_name+'</div>';
      h+='<div class="limit">'+(it.daily_limit?('每日限购 '+it.daily_limit):'不限购')+'</div>';
      h+='<input id="qty_'+it.id+'" type="number" min="1" max="99" value="1" style="width:56px;margin:4px auto;display:block;text-align:center">';
      h+='<span class="btn btn-p" style="padding:4px 12px;font-size:11px;margin-top:6px" onclick="buyItem('+it.id+')">购买</span></div>';
    }
    document.getElementById('shopList').innerHTML=h||'<div style="color:#999;font-size:13px">暂无商品</div>';
  }).catch(function(){document.getElementById('shopLoading').style.display='none';showErr('网络异常');});
}

function loadInventory(){
  fetch('/game/jwt/api/v1/inventory/list?player_id='+pid,{headers:{'Authorization':'Bearer '+localStorage.getItem('token')}})
  .then(function(r){return r.json()}).then(function(d){
    if(d.code!==0){document.getElementById('invList').textContent='加载失败';return;}
    var items=d.data||[];
    var h='';
    for(var i=0;i<items.length;i++){
      var it=items[i];
      h+='<div class="inv-item"><span><b>'+it.name+'</b> x'+it.quantity+'</span>';
      h+='<span class="btns">';
      if(it.item_type!==3){
        h+='<span class="btn btn-g" style="padding:2px 10px;font-size:11px" onclick="useItem('+it.item_id+')">使用</span>';
      }
      h+='</span></div>';
    }
    document.getElementById('invList').innerHTML=h||'<div style="color:#999;font-size:12px">背包空空如也</div>';
  }).catch(function(){document.getElementById('invList').textContent='网络异常';});
}

function buyItem(itemId){
  var qtyEl=document.getElementById('qty_'+itemId);
  var qty=qtyEl?parseInt(qtyEl.value)||1:1;
  if(qty<1||qty>99){alert('购买数量需在 1-99 之间');return;}
  fetch('/game/jwt/api/v1/shop/buy?player_id='+pid,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+localStorage.getItem('token')},body:JSON.stringify({item_id:itemId,quantity:qty})})
  .then(function(r){return r.json()}).then(function(d){
    if(d.code===0){alert('购买成功 x'+qty);loadShop();loadInventory();loadPlayer();}
    else{alert(d.message||'购买失败');}
  }).catch(function(){alert('网络异常');});
}

function useItem(itemId){
  fetch('/game/jwt/api/v1/inventory/use?player_id='+pid,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+localStorage.getItem('token')},body:JSON.stringify({item_id:itemId,quantity:1})})
  .then(function(r){return r.json()}).then(function(d){
    if(d.code===0){alert('使用成功');loadInventory();loadPlayer();}
    else{alert(d.message||'使用失败');}
  }).catch(function(){alert('网络异常');});
}

function showErr(msg){
  var el=document.getElementById('shopError');
  el.style.display='block';el.textContent=msg;
}

function loadPlayer(){
  fetch('/game/jwt/api/v1/player/info?player_id='+pid,{headers:{'Authorization':'Bearer '+localStorage.getItem('token')}})
  .then(function(r){return r.json()}).then(function(d){
    if(d.code!==0)return;
    var p=d.data;
    document.getElementById('moneyBar').innerHTML='<span>金币: <b>'+p.gold+'</b></span><span>元宝: <b>'+p.ingot+'</b></span><span>修为: <b>'+p.reputation+'</b></span>';
    document.getElementById('topPlayerInfo').innerHTML=renderTopPlayer(p);
    document.getElementById('sName').innerHTML=renderPlayerName(p);
    document.getElementById('sInfo').textContent='Lv.'+(p.level||1)+' | 战力 '+(p.combat_power||0);
    document.getElementById('sHp').textContent=(p.hp||0)+'/'+(p.max_hp||0);
    document.getElementById('sMp').textContent=(p.mp||0)+'/'+(p.max_mp||0);
    document.getElementById('sStamina').textContent=p.stamina||0;
  });
}

(function(){
  var tabs=document.querySelectorAll('#catTabs .tab');
  for(var i=0;i<tabs.length;i++){
    tabs[i].addEventListener('click',function(){
      document.querySelectorAll('#catTabs .tab').forEach(function(t){t.classList.remove('active');});
      this.classList.add('active');
      curCat=parseInt(this.dataset.cat)||0;
      loadShop();
    });
  }
})();
loadShop();
loadInventory();
loadPlayer();
</script>
<script>
var token=localStorage.getItem('token');if(!token){window.location.href='/game/jwt/';}
function handleLogout(){sessionStorage.removeItem('gcState');localStorage.removeItem('token');localStorage.removeItem('user_id');localStorage.removeItem('player_id');window.location.href='/game/jwt/';}
</script>
</body></html>
