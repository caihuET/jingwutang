<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>好友 | 精武堂</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei",sans-serif;background:#f5f0e8;color:#2c1810;height:100vh;display:flex;flex-direction:column}
.topbar{height:50px;background:linear-gradient(90deg,#1a1a2e,#2c2c44);border-bottom:2px solid #c9a96e;display:flex;align-items:center;padding:0 20px;flex-shrink:0}
.topbar .logo{font-size:18px;font-weight:700;color:#c9a96e;letter-spacing:4px;margin-right:24px}
.topbar .player{margin-left:auto;color:#c9a96e;font-size:13px}
.game-body{display:flex;flex:1;overflow:hidden}
.sidebar{width:200px;background:linear-gradient(180deg,#1e1e32,#151525);border-right:1px solid rgba(201,169,110,0.2);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sidebar .profile{padding:16px;border-bottom:1px solid rgba(201,169,110,0.15);text-align:center}
.sidebar .profile .avatar{width:48px;height:48px;border-radius:50%;border:2px solid #c9a96e;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;background:rgba(201,169,110,0.1);font-size:20px}
.sidebar .profile .name{font-size:14px;font-weight:700;color:#c9a96e}
.sidebar .profile .info{font-size:11px;color:#6b5b4e;margin-top:2px}
.sidebar .stats{padding:10px 16px;border-bottom:1px solid rgba(201,169,110,0.1)}
.sidebar .stats .srow{display:flex;justify-content:space-between;font-size:11px;color:#c9a96e;padding:2px 0}
.sidebar .nav{padding:8px 0;flex:1}
.nav-item{display:flex;align-items:center;gap:8px;padding:8px 16px;color:#6b5b4e;cursor:pointer;font-size:13px;border-left:3px solid transparent;text-decoration:none}
.nav-item:hover{color:#c9a96e;background:rgba(201,169,110,0.05)}
.nav-item.active{color:#c9a96e;background:rgba(201,169,110,0.08);border-left-color:#c9a96e}
.content{flex:1;padding:20px;overflow-y:auto}
.page-title{font-size:18px;color:#8b1a1a;margin-bottom:16px;padding-bottom:8px;border-bottom:2px solid #d4c5a9}
.card{background:white;border:1px solid #d4c5a9;border-radius:8px;padding:14px;margin-bottom:12px}
.card-title{font-size:13px;font-weight:600;color:#8b1a1a;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid #d4c5a9}
.btn{padding:6px 14px;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;display:inline-block;text-decoration:none;text-align:center}
.btn-p{background:linear-gradient(135deg,#8b1a1a,#5c0e0e);color:#c9a96e}
.btn-g{background:linear-gradient(135deg,#c9a96e,#a08040);color:#1a1a2e}
.row{display:flex;align-items:center;justify-content:space-between;border:1px solid #d4c5a9;border-radius:6px;padding:8px 12px;margin-bottom:6px;font-size:12px;flex-wrap:wrap;gap:6px}
.row .btns{display:flex;gap:6px;flex-wrap:wrap}
input[type=text]{padding:7px 10px;border:1px solid #d4c5a9;border-radius:6px;font-size:12px;width:220px;outline:none}
.empty{color:#999;font-size:12px;padding:6px 0}
@media(max-width:768px){.sidebar{display:none}}
</style>
<script src="/game/jwt/static/js/common.js?v=10"></script>
</head>
<body>
<div class="topbar">
<a href="game.html" style="color:inherit;text-decoration:none"><div class="logo">精武<span>堂</span></div></a>
<div class="player" id="topPlayerInfo">加载中...</div>
<button onclick="handleLogout()" style="background:transparent;border:1px solid #c9a96e;color:#c9a96e;padding:4px 12px;border-radius:4px;cursor:pointer;font-size:12px;margin-left:12px">退出</button>
</div>
<div class="game-body">
<div class="sidebar">
<div class="profile"><div class="avatar">*</div><div class="name" id="sName">-</div><div class="info" id="sInfo">-</div></div>
<div class="stats">
<div class="srow"><span>HP</span><span id="sHp">-</span></div>
<div class="srow"><span>MP</span><span id="sMp">-</span></div>
<div class="srow"><span>体力</span><span id="sStamina">-</span></div>
</div>
<div class="nav">
<a class="nav-item " href="battle.html">历练</a>
<a class="nav-item " href="equipment.html">装备</a>
<a class="nav-item " href="skills.html">技能</a>
<a class="nav-item " href="meridians.html">经脉</a>
<a class="nav-item " href="tasks.html">任务</a>
<a class="nav-item " href="ranking.html">排行</a>
<a class="nav-item " href="shop.html">商城</a>
<a class="nav-item active" href="friend.html">好友</a>
<a class="nav-item " href="guild.html">帮派</a>
<a class="nav-item " href="equip-guide.html">装备说明</a>
</div>
</div>
<div class="content">
<div class="page-title">好友</div>
<div class="card">
<div class="card-title">添加好友</div>
<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
<input type="text" id="friendName" placeholder="输入玩家昵称">
<span class="btn btn-p" onclick="addFriend()">申请</span>
</div>
<div id="friendError" style="color:#c0392b;font-size:12px;margin-top:6px;display:none"></div>
</div>
<div class="card">
<div class="card-title">好友申请</div>
<div id="requestList">加载中...</div>
</div>
<div class="card">
<div class="card-title">我发出的申请</div>
<div id="historyList">加载中...</div>
</div>
<div class="card">
<div class="card-title">我的好友</div>
<div id="friendList">加载中...</div>
</div>
</div>
</div>
<script>
var pid=localStorage.getItem('player_id')||1;
function apiHeaders(){return {'Content-Type':'application/json','Authorization':'Bearer '+localStorage.getItem('token')};}
function showFriendErr(msg){var el=document.getElementById('friendError');el.style.display='block';el.textContent=msg;}
function loadRequests(){
  fetch('/game/jwt/api/v1/friend/requests?player_id='+pid,{headers:apiHeaders()})
  .then(function(r){return r.json()}).then(function(d){
    if(d.code!==0){document.getElementById('requestList').textContent=d.message||'加载失败';return;}
    var list=d.data&&d.data.requests||[];
    var h='';
    for(var i=0;i<list.length;i++){
      var f=list[i];
      h+='<div class="row"><span><b>'+f.name+'</b> Lv.'+(f.level||1)+' 战力 '+(f.combat_power||0)+'</span>';
      h+='<span class="btns"><span class="btn btn-g" onclick="respond('+f.player_id+',true)">接受</span>';
      h+='<span class="btn btn-p" onclick="respond('+f.player_id+',false)">拒绝</span></span></div>';
    }
    document.getElementById('requestList').innerHTML=h||'<div class="empty">暂无好友申请</div>';
  }).catch(function(){document.getElementById('requestList').textContent='网络异常';});
}
function loadFriends(){
  fetch('/game/jwt/api/v1/friend/list?player_id='+pid,{headers:apiHeaders()})
  .then(function(r){return r.json()}).then(function(d){
    if(d.code!==0){document.getElementById('friendList').textContent=d.message||'加载失败';return;}
    var list=d.data&&d.data.friends||[];
    var ids=[];
    for(var i=0;i<list.length;i++){ids.push(list[i].player_id);}
    fetch('/game/jwt/api/v1/chat/online?player_ids='+ids.join(','),{headers:apiHeaders()})
    .then(function(r){return r.json()})
    .then(function(od){
      var onlineMap=od.data||{};
      var h='';
      for(var i=0;i<list.length;i++){
        var f=list[i];
        var online=onlineMap[f.player_id]?'<span style="color:#4caf50">在线</span>':'<span style="color:#999">离线</span>';
        h+='<div class="row"><span><b>'+f.name+'</b> Lv.'+(f.level||1)+' 战力 '+(f.combat_power||0)+' '+online+'</span>';
        h+='<span class="btns"><span class="btn btn-g" onclick="giftStamina('+f.player_id+')">赠送体力</span>';
        h+='<span class="btn btn-g" onclick="sparFriend('+f.player_id+')">切磋</span>';
        h+='<span class="btn btn-p" onclick="removeFriend('+f.player_id+')">删除</span></span></div>';
      }
      document.getElementById('friendList').innerHTML=h||'<div class="empty">还没有好友</div>';
    })
    .catch(function(){
      var h='';
      for(var i=0;i<list.length;i++){
        var f=list[i];
        h+='<div class="row"><span><b>'+f.name+'</b> Lv.'+(f.level||1)+' 战力 '+(f.combat_power||0)+'</span>';
        h+='<span class="btns"><span class="btn btn-g" onclick="giftStamina('+f.player_id+')">赠送体力</span>';
        h+='<span class="btn btn-g" onclick="sparFriend('+f.player_id+')">切磋</span>';
        h+='<span class="btn btn-p" onclick="removeFriend('+f.player_id+')">删除</span></span></div>';
      }
      document.getElementById('friendList').innerHTML=h||'<div class="empty">还没有好友</div>';
    });
  }).catch(function(){document.getElementById('friendList').textContent='网络异常';});
}
function loadRequestHistory(){
  fetch('/game/jwt/api/v1/friend/request-history?player_id='+pid,{headers:apiHeaders()})
  .then(function(r){return r.json()}).then(function(d){
    if(d.code!==0){document.getElementById('historyList').textContent=d.message||'加载失败';return;}
    var list=d.data&&d.data.requests||[];
    var h='';
    var colors={0:'#ff9800',1:'#4caf50',2:'#e53935',3:'#999'};
    for(var i=0;i<list.length;i++){
      var r=list[i];
      h+='<div class="row"><span><b>'+r.name+'</b> Lv.'+(r.level||1)+'</span>';
      h+='<span style="color:'+(colors[r.status]||'#666')+'">'+r.status_name+'</span></div>';
    }
    document.getElementById('historyList').innerHTML=h||'<div class="empty">暂无申请记录</div>';
  }).catch(function(){document.getElementById('historyList').textContent='网络异常';});
}
function addFriend(){
  var name=document.getElementById('friendName').value.trim();
  if(!name){showFriendErr('请输入玩家昵称');return;}
  showFriendErr('');
  fetch('/game/jwt/api/v1/friend/add?player_id='+pid,{method:'POST',headers:apiHeaders(),body:JSON.stringify({player_name:name})})
  .then(function(r){return r.json()}).then(function(d){
    if(d.code===0){showToast('好友申请已发送','success');document.getElementById('friendName').value='';loadRequests();}
    else{showFriendErr(d.message||'操作失败');}
  }).catch(function(){showFriendErr('网络异常');});
}
function respond(id,accept){
  fetch('/game/jwt/api/v1/friend/respond?player_id='+pid,{method:'POST',headers:apiHeaders(),body:JSON.stringify({player_id:id,accept:accept})})
  .then(function(r){return r.json()}).then(function(d){
    if(d.code===0){
      if(accept){updateFriendCount(1);}
      updateFriendBadge(-1);
      loadRequests();loadFriends();
    }
    else{showToast(d.message||'操作失败','error');}
  }).catch(function(){showToast('网络异常','error');});
}
function removeFriend(id){
  fetch('/game/jwt/api/v1/friend/remove?player_id='+pid,{method:'POST',headers:apiHeaders(),body:JSON.stringify({player_id:id})})
  .then(function(r){return r.json()}).then(function(d){
    if(d.code===0){updateFriendCount(-1);loadFriends();}
    else{showToast(d.message||'操作失败','error');}
  }).catch(function(){showToast('网络异常','error');});
}
function giftStamina(id){
  fetch('/game/jwt/api/v1/friend/gift-stamina?player_id='+pid,{method:'POST',headers:apiHeaders(),body:JSON.stringify({player_id:id})})
  .then(function(r){return r.json()}).then(function(d){
    if(d.code===0){showToast('已赠送 10 点体力','success');}
    else{showToast(d.message||'操作失败','error');}
  }).catch(function(){showToast('网络异常','error');});
}
function sparFriend(id){
  fetch('/game/jwt/api/v1/friend/spar?player_id='+pid,{method:'POST',headers:apiHeaders(),body:JSON.stringify({player_id:id})})
  .then(function(r){return r.json()}).then(function(d){
    if(d.code===0){showToast('切磋结果：'+(d.data.result==='win'?'胜利':'失败'),d.data.result==='win'?'success':'error');}
    else{showToast(d.message||'操作失败','error');}
  }).catch(function(){showToast('网络异常','error');});
}
window.onFriendRequest=function(){loadRequests();};
loadRequests();
loadFriends();
setInterval(loadFriends, 30000);
loadRequestHistory();
</script>
<script>
var token=localStorage.getItem('token');if(!token){window.location.href='/game/jwt/';}
function handleLogout(){sessionStorage.removeItem('gcState');localStorage.removeItem('token');localStorage.removeItem('user_id');localStorage.removeItem('player_id');window.location.href='/game/jwt/';}
fetch('/game/jwt/api/v1/player/info?player_id='+pid,{headers:{'Authorization':'Bearer '+token}})
.then(function(r){return r.json()})
.then(function(d){
  if(d.code!==0)return;
  var p=d.data;
  document.getElementById('topPlayerInfo').innerHTML=renderTopPlayer(p);
  var el=function(i){return document.getElementById(i)};
  if(el('sName'))el('sName').innerHTML=renderPlayerName(p);
  if(el('sInfo'))el('sInfo').textContent='Lv.'+(p.level||1)+' | 战力 '+(p.combat_power||0);
  if(el('sHp'))el('sHp').textContent=(p.hp||0)+'/'+(p.max_hp||0);
  if(el('sMp'))el('sMp').textContent=(p.mp||0)+'/'+(p.max_mp||0);
  if(el('sStamina'))el('sStamina').textContent=p.stamina||0;
});
</script>
</body></html>
