<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>精武堂</title>
<link rel="stylesheet" href="/game/jwt/static/css/login.css">
</head>
<body>
<div class="card">
<h1>精武堂</h1>
<p class="sub">以武会友 · 仗剑天涯</p>
<div class="tabs">
<div class="tab active" data-target="loginTab">登 录</div>
<div class="tab" data-target="registerTab">注 册</div>
</div>
<div id="loginTab" class="tab-content active">
<form id="loginForm">
<label>用户名</label>
<input type="text" id="loginUsername" placeholder="请输入用户名" maxlength="16" required>
<label>密码</label>
<input type="password" id="loginPassword" placeholder="请输入密码" required>
<button type="submit" class="btn">登 录</button>
</form>
</div>
<div id="registerTab" class="tab-content">
<form id="registerForm">
<label>用户名</label>
<input type="text" id="regUsername" placeholder="4-16位字母/数字/下划线" maxlength="16" required>
<label>密码</label>
<input type="password" id="regPassword" placeholder="4-12位英文+数字组合" required>
<label>确认密码</label>
<input type="password" id="regConfirm" placeholder="再次输入密码" required>
<button type="submit" class="btn">注 册</button>
</form>
</div>
<div id="errorMsg" class="error-msg"></div>
<div id="loadingOverlay" class="loading-overlay">
<div class="spinner"></div>
</div>
</div>
<script src="/game/jwt/static/js/auth.js"></script>
</body>
</html>
