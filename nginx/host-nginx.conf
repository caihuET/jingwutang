server {
    listen 443 ssl http2;
    server_name xui6.bbbus.top www.bbbus.top;

    ssl_certificate /root/.acme.sh/bbbus.top_ecc/fullchain.cer;
    ssl_certificate_key /root/.acme.sh/bbbus.top_ecc/bbbus.top.key;

    # 服务器监控项目
    location = /sur {
        return 301 /sur/;
    }

    location /sur/ {
        proxy_pass http://127.0.0.1:9000/sur/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 精武堂游戏项目
    location /jwt/ {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /jwt/favicon.ico {
        alias /var/www/jingwutang/favicon.ico;
    }

    location = /favicon.ico {
        alias /var/www/jingwutang/favicon.ico;
    }

    location = /robots.txt {
        proxy_pass http://127.0.0.1:9001/jwt/static/robots.txt;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:9001/jwt/static/sitemap.xml;
    }

    location /game/jwt/ {
        rewrite ^/game/jwt/(.*)$ /jwt/$1 permanent;
    }
}

server {
    listen 80;
    server_name xui6.bbbus.top www.bbbus.top;
    return 301 https://$host$request_uri;
}
