server {
    listen 9001;
    server_name xui6.bbbus.top;

    charset utf-8;

    # 静态资源
    location /game/jwt/static/ {
        alias /usr/share/nginx/html/game/jwt/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # 前端页面
    location /game/jwt/ {
        alias /usr/share/nginx/html/game/jwt/frontend/pages/;
        index index.html;
    }

    # API 代理到后端
    location /game/jwt/api/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /game/jwt;
    }
}
