version: "3.8"

services:
  app:
    build: .
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: Aa123,,
      DB_NAME: jingwutang
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: jingwutang-prod-secret-2026
      APP_ROOT_PATH: /game/jwt
    expose:
      - "8000"
    volumes:
      - ./static:/app/static:ro
      - ./templates:/app/templates:ro
    depends_on:
      - mysql
      - redis
    restart: always

  nginx:
    image: nginx:1.22-alpine
    ports:
      - "9001:9001"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html/game/jwt/frontend:ro
      - ./static:/usr/share/nginx/html/game/jwt/static:ro
    depends_on:
      - app
    restart: always

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: Aa123,,
      MYSQL_DATABASE: jingwutang
    volumes:
      - mysql_data:/var/lib/mysql
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3307:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: always

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    restart: always

volumes:
  mysql_data:
  redis_data:
