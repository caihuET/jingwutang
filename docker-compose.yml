services:
  app:
    build: .
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: Aa123,,.
      DB_NAME: jingwutang
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: jingwutang-prod-secret-2026
      APP_ROOT_PATH: /jwt
    expose:
      - "8000"
    volumes:
      - ./static:/app/static:ro
      - ./templates:/app/templates:ro
      - ./src:/app/src:ro
    depends_on:
      - redis
    restart: always

  nginx:
    image: nginx:1.22-alpine
    ports:
      - "9001:9001"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html/jwt/frontend:ro
      - ./static:/usr/share/nginx/html/jwt/static:ro
    depends_on:
      - app
    restart: always

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: always

volumes:
  redis-data:
