services:
  app:
    build: .
    environment:
      DB_HOST: 172.17.0.1
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: Aa123,,.
      DB_NAME: jingwutang
      REDIS_HOST: 172.17.0.1
      REDIS_PORT: "6379"
      JWT_SECRET: jingwutang-prod-secret-2026
      APP_ROOT_PATH: /game/jwt
    expose:
      - "8000"
    volumes:
      - ./static:/app/static:ro
      - ./templates:/app/templates:ro
    restart: always

  nginx:
    image: nginx:1.22-alpine
    ports:
      - "9001:9001"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html/game/jwt/frontend:ro
      - ./static:/usr/share/nginx/html/game/jwt/static:ro
    depends_on:
      - app
    restart: always
